# Local development. Open http://localhost:8095
# (8095 because 8080 and 8090 are used by other projects.)
name: iibsom

x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  volumes:
    - ./:/var/www/html
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_started
  restart: unless-stopped

services:
  app:
    <<: *php

  queue:
    <<: *php
    command: php artisan queue:work redis --sleep=1 --tries=3 --max-time=3600

  scheduler:
    <<: *php
    command: php artisan schedule:work

  web:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8095}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-iibsom}
      MYSQL_USER: ${DB_USERNAME:-iibsom}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "33095:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8096:8025"
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
